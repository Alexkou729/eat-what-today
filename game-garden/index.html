<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>植物养成 - 今日吃什么</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9f4;--bg-card:#fff;--green:#52b788;--green-dark:#3a9d6e;--green-light:#95d5b2;--green-pale:#d8f3dc;--brown:#8b7355;--brown-light:#c4a77d;--gold:#f4d03f;--blue:#74b9ff;--purple:#a29bfe;--text:#2d5a3d;--text-dim:#7aa88a;--shadow:0 4px 20px rgba(82,183,136,0.15);--shadow-hover:0 8px 30px rgba(82,183,136,0.25);--radius:20px;--radius-sm:12px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.game-container{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#52b788,#3a9d6e);padding:20px 16px 16px;color:#fff;position:sticky;top:0;z-index:50}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.game-title{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.header-right{display:flex;align-items:center;gap:16px}
.coins-display{background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.weather-badge{background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:16px;font-size:13px;display:flex;align-items:center;gap:4px}
.garden-area{background:var(--bg-card);margin:16px;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.garden-title{font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:16px;display:flex;align-items:center;gap:6px}
.plants-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plant-slot{aspect-ratio:1;background:var(--green-pale);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative;border:2px dashed var(--green-light)}
.plant-slot:hover{transform:scale(1.03);box-shadow:var(--shadow-hover)}
.plant-slot.filled{border-style:solid;border-color:var(--green)}
.plant-slot.locked{opacity:.5;cursor:not-allowed}
.plant-emoji{font-size:42px;margin-bottom:4px;transition:transform .3s}
.plant-slot:hover .plant-emoji{transform:scale(1.1)}
.plant-stage{font-size:11px;color:var(--text-dim);text-align:center}
.plant-progress{width:80%;height:6px;background:rgba(82,183,136,0.2);border-radius:3px;margin-top:6px;overflow:hidden}
.plant-progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .5s ease}
.daily-tasks{background:var(--bg-card);margin:0 16px 16px;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.tasks-title{font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.tasks-title span:last-child{font-size:12px;color:var(--text-dim);font-weight:400}
.tasks-list{display:flex;flex-direction:column;gap:10px}
.task-item{background:var(--green-pale);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .3s}
.task-item:hover{transform:translateX(4px);box-shadow:var(--shadow)}
.task-item.completed{opacity:.6;background:rgba(82,183,136,0.1)}
.task-item.completed .task-check{background:var(--green);color:#fff}
.task-icon{font-size:24px;flex-shrink:0}
.task-info{flex:1}
.task-name{font-size:14px;font-weight:600}
.task-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.task-reward{font-size:12px;color:var(--green-dark);font-weight:600;white-space:nowrap}
.task-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.shop-section{background:var(--bg-card);margin:0 16px 16px;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.shop-title{font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{background:var(--green-pale);border-radius:var(--radius-sm);padding:14px;text-align:center;cursor:pointer;transition:all .3s;border:2px solid transparent}
.shop-item:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--shadow)}
.shop-item-icon{font-size:28px;margin-bottom:6px}
.shop-item-name{font-size:13px;font-weight:600;margin-bottom:4px}
.shop-item-price{font-size:12px;color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.shop-item:disabled{opacity:.4;cursor:not-allowed;transform:none}
.achievements-section{background:var(--bg-card);margin:0 16px 16px;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.achieve-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.achieve-item{background:var(--green-pale);border-radius:var(--radius-sm);padding:12px;text-align:center;transition:all .3s}
.achieve-item.unlocked{border:2px solid var(--gold);background:linear-gradient(135deg,#fffef0,#fff8e1)}
.achieve-item.locked{opacity:.5}
.achieve-icon{font-size:24px;margin-bottom:4px}
.achieve-name{font-size:12px;font-weight:600}
.achieve-desc{font-size:10px;color:var(--text-dim);margin-top:2px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:10px 0;z-index:50;max-width:520px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,0.08)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;transition:all .3s;border-radius:10px}
.nav-btn.active{color:var(--green);background:var(--green-pale)}
.nav-icon{font-size:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg-card);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal-emoji{font-size:56px;margin-bottom:12px}
.modal-title{font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px}
.modal-desc{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
.modal-btn{padding:14px 32px;background:linear-gradient(135deg,#52b788,#3a9d6e);color:#fff;border:none;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all .3s;box-shadow:0 4px 16px rgba(82,183,136,0.3)}
.modal-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(82,183,136,0.4)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--green-pale);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--bg-card);border:2px solid var(--green);border-radius:30px;padding:10px 20px;font-size:13px;color:var(--green-dark);z-index:1000;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(82,183,136,0.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tab-content{display:none}
.tab-content.active{display:block}
.sections{display:none}
.sections.active{display:block}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="header-top">
      <div class="game-title">🌱 植物养成</div>
      <div class="header-right">
        <div class="coins-display">🪙 <span id="coins">100</span></div>
        <div class="weather-badge" id="weather-badge">☀️ 晴天</div>
      </div>
    </div>
  </div>

  <div class="sections active" id="garden-tab">
    <div class="garden-area">
      <div class="garden-title">🏡 我的花园</div>
      <div class="plants-grid" id="plants-grid"></div>
    </div>

    <div class="daily-tasks">
      <div class="tasks-title">📋 每日任务 <span id="task-progress">0/4</span></div>
      <div class="tasks-list" id="tasks-list"></div>
    </div>
  </div>

  <div class="sections" id="shop-tab">
    <div class="shop-section">
      <div class="shop-title">🛒 商店</div>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </div>

  <div class="sections" id="achieve-tab">
    <div class="achievements-section">
      <div class="shop-title">🏆 成就</div>
      <div class="achieve-grid" id="achieve-grid"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('garden')"><span class="nav-icon">🏡</span>花园</button>
    <button class="nav-btn" onclick="switchTab('shop')"><span class="nav-icon">🛒</span>商店</button>
    <button class="nav-btn" onclick="switchTab('achieve')"><span class="nav-icon">🏆</span>成就</button>
  </div>
</div>

<div class="modal-overlay" id="plant-modal">
  <div class="modal-box">
    <div class="modal-emoji" id="modal-emoji">🌻</div>
    <div class="modal-title" id="modal-title">向日葵</div>
    <div class="modal-desc" id="modal-desc">当前阶段：成长中</div>
    <div class="modal-btn" id="modal-action" onclick="plantAction()">浇水 💧</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEATHERS=['☀️ 晴天','🌤️ 多云','🌧️ 雨天','❄️ 霜冻'];
const STAGES=['种子','🌱 幼苗','🌿 成长中','🌳 成熟','🌸 开花'];
const PLANT_TYPES=[{id:'sunflower',name:'向日葵',emoji:'🌻',price:0,timePerStage:1,color:'#f4d03f'},{id:'succulent',name:'多肉',emoji:'🌵',price:50,timePerStage:2,color:'#95d5b2'},{id:'rose',name:'玫瑰',emoji:'🌹',price:100,timePerStage:3,color:'#e74c3c'}];
const DAILY_TASKS=[{id:'water',icon:'💧',name:'浇水',desc:'给所有植物浇水',reward:10,action:'water'},{id:'sun',icon:'☀️',name:'晒太阳',desc:'晴天时领取阳光奖励',reward:15,action:'sun'},{id:'prune',icon:'✂️',name:'修剪',desc:'修剪任意一株植物',reward:20,action:'prune'},{id:'fertilize',icon:'🌱',name:'施肥',desc:'使用化肥加速生长',reward:30,action:'fertilize'}];
const ACHIEVEMENTS=[{id:'firstPlant',name:'园丁入门',emoji:'🌱',desc:'种下第一株植物',reward:50},{id:'bloom10',name:'百花齐放',emoji:'🌸',desc:'让10株植物开花',reward:200},{id:'weekStreak',name:'花园守护者',emoji:'🛡️',desc:'连续7天打卡',reward:500},{id:'allTypes',name:'植物学家',emoji:'📚',desc:'集齐所有植物类型',reward:300},{id:'rich',name:'富翁',emoji:'💰',desc:'拥有1000金币',reward:100}];
const SHOP_ITEMS=[{id:'pot',icon:'🪴',name:'花盆',desc:'解锁第4个种植位',price:200,type:'slot'},{id:'fertilizer',icon:'🌱',name:'化肥',desc:'加速生长1天',price:30,type:'item'},{id:'sunny',icon:'☀️',name:'晴天卡',desc:'明天必定晴天',price:80,type:'weather'},{id:'water',icon:'💧',name:'水壶',desc:'自动浇水1次',price:50,type:'item'}];
let G={};

function getDefaultState(){return{coins:100,plants:[null,null,null,null,null,null],tasks:{water:false,sun:false,prune:false,fertilize:false},achievements:[],streak:0,lastLogin:null,weather:WEATHERS[0],weatherOverride:null,shopItems:{pot:false,fertilizer:0,sunny:0,water:0},totalBlooms:0,unlockedTypes:['sunflower']}}

function loadState(){const s=localStorage.getItem('garden_v1');G=s?Object.assign(getDefaultState(),JSON.parse(s)):getDefaultState()}
function saveState(){localStorage.setItem('garden_v1',JSON.stringify(G))}

function getToday(){return new Date().toDateString()}
function getYesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toDateString()}

function updateWeather(){
  if(G.weatherOverride){G.weather=G.weatherOverride;G.weatherOverride=null}else{
    const rand=Math.random();if(rand<.4)G.weather=WEATHERS[0];else if(rand<.7)G.weather=WEATHERS[1];else if(rand<.9)G.weather=WEATHERS[2];else G.weather=WEATHERS[3]}
  document.getElementById('weather-badge').textContent=G.weather
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

function renderPlants(){
  const grid=document.getElementById('plants-grid');grid.innerHTML='';
  const maxSlots=G.shopItems.pot?6:3;
  for(let i=0;i<6;i++){
    const plant=G.plants[i];const div=document.createElement('div');
    if(i>=maxSlots&&!plant){div.className='plant-slot locked';div.innerHTML='🔒';grid.appendChild(div);continue}
    div.className='plant-slot'+(plant?' filled':'');
    if(plant){
      const stage=Math.min(STAGES.length-1,plant.stage);
      div.innerHTML=`<span class="plant-emoji">${STAGES[stage]}</span><div class="plant-stage">${plant.name}</div><div class="plant-progress"><div class="plant-progress-fill" style="width:${(plant.progress/plant.maxProgress)*100}%"></div></div>`;
      div.onclick=()=>openPlantModal(i)}else{div.innerHTML='➕';div.onclick=()=>openPlantModal(i)}
    grid.appendChild(div)}}

function openPlantModal(index){const plant=G.plants[index];const modal=document.getElementById('plant-modal');
if(plant){const stage=Math.min(STAGES.length-1,plant.stage);document.getElementById('modal-emoji').textContent=STAGES[stage];document.getElementById('modal-title').textContent=plant.name;const progress=Math.round((plant.progress/plant.maxProgress)*100);document.getElementById('modal-desc').textContent=`阶段：${STAGES[stage]} (${progress}%)`;
const actions=['💧浇水','☀️晒太阳','✂️修剪','🌱施肥'];document.getElementById('modal-action').textContent=actions[index%4];document.getElementById('modal-action').onclick=()=>doPlantAction(index);modal.dataset.index=index;modal.classList.add('active')}else{document.getElementById('modal-emoji').textContent='➕';document.getElementById('modal-title').textContent='种植新植物';document.getElementById('modal-desc').textContent='选择一个植物种子';const types=PLANT_TYPES.map(p=>{const owned=G.unlockedTypes.includes(p.id);const canAfford=G.coins>=p.price;return`<button style="padding:12px 20px;margin:6px;background:${p.color}22;border:2px solid ${p.color};border-radius:16px;font-size:14px;cursor:${canAfford&&owned?'pointer':'not-allowed'};opacity:${canAfford&&owned?'1':'0.5'}" ${canAfford&&owned?`onclick="plantSeed(${index},'${p.id}')"`:'disabled'}>${p.emoji} ${p.name} ${p.price>0?'🪙'+p.price:''}</button>`}).join('');document.getElementById('modal-action').outerHTML=`<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px">${types}</div>`;document.querySelector('.modal-box').innerHTML+=`<button class="modal-btn" onclick="closeModal()" style="margin-top:16px">关闭</button>`;document.querySelector('.modal-box').querySelector('.modal-desc').remove();modal.classList.add('active')}}

function plantSeed(index,typeId){const type=PLANT_TYPES.find(p=>p.id===typeId);if(!type)return;if(G.coins<type.price){showToast('金币不足!');return}G.coins-=type.price;G.plants[index]={typeId,name:type.name,emoji:type.emoji,stage:0,progress:0,maxProgress:type.timePerStage*24,lastUpdate:Date.now()};if(!G.unlockedTypes.includes(typeId))G.unlockedTypes.push(typeId);closeModal();renderPlants();saveState();showToast(`种下了 ${type.name}!`)}

function doPlantAction(index){const plant=G.plants[index];if(!plant)return;const weather=G.weather;if(weather===WEATHERS[3]){showToast('霜冻天气，植物暂停生长!');return}
plant.progress+=8;if(plant.progress>=plant.maxProgress&&plant.stage<STAGES.length-1){plant.stage++;plant.progress=0;showToast(`🌸 ${plant.name} 升级了!`);if(plant.stage===STAGES.length-1){G.totalBlooms++;checkAchievements()}}else{const stageName=STAGES[Math.min(STAGES.length-1,plant.stage)];showToast(`${plant.name} ${stageName} 状态良好!`)}
closeModal();renderPlants();saveState()}

function renderTasks(){const list=document.getElementById('tasks-list');const todayTasks=G.tasks;const completed=Object.values(todayTasks).filter(v=>v).length;document.getElementById('task-progress').textContent=`${completed}/4`;list.innerHTML=DAILY_TASKS.map(task=>{const done=todayTasks[task.id];return`<div class="task-item ${done?'completed':''}" ${done?'':`onclick="doTask('${task.id}')"`}><span class="task-icon">${task.icon}</span><div class="task-info"><div class="task-name">${task.name}</div><div class="task-desc">${task.desc}</div></div><span class="task-reward">+${task.reward}🪙</span>${done?'<span class="task-check">✓</span>':''}</div>`}).join('')}

function doTask(taskId){const task=DAILY_TASKS.find(t=>t.id===taskId);if(!task||G.tasks[taskId])return;if(taskId==='sun'&&!G.weather.startsWith('☀️')){showToast('只有晴天才能完成!');return}G.coins+=task.reward;G.tasks[taskId]=true;if(taskId==='water')G.plants.forEach((p,i)=>{if(p){G.plants[i].progress=Math.min(G.plants[i].maxProgress,p.progress+5)}});renderTasks();renderPlants();updateCoins();saveState();showToast(`任务完成! +${task.reward}🪙`);checkAchievements()}

function renderShop(){const grid=document.getElementById('shop-grid');grid.innerHTML=SHOP_ITEMS.map(item=>{const owned=item.type==='slot'?G.shopItems[item.id]:false;const qty=item.type==='item'?G.shopItems[item.id]:0;const canAfford=G.coins>=item.price;const disabled=owned||(!canAfford&&item.price>0);return`<div class="shop-item" ${disabled?'':`onclick="buyItem('${item.id}')"`}><span class="shop-item-icon">${item.icon}</span><div class="shop-item-name">${item.name}</div><div class="shop-item-price">${item.price>0?'🪙'+item.price:qty>0?'x'+qty:'免费'}</div>${owned?'<div style="font-size:11px;color:var(--green)">已拥有</div>':''}</div>`}).join('')}

function buyItem(itemId){const item=SHOP_ITEMS.find(i=>i.id===itemId);if(!item)return;if(G.coins<item.price){showToast('金币不足!');return}if(item.type==='slot'&&G.shopItems[item.id]){showToast('已拥有!');return}G.coins-=item.price;if(item.type==='slot')G.shopItems[item.id]=true;else if(item.type==='weather'){G.weatherOverride=WEATHERS[0];updateWeather();showToast('明天晴天!')}else G.shopItems[itemId]=(G.shopItems[itemId]||0)+1;closeModal();renderShop();updateCoins();saveState();showToast(`购买了 ${item.name}!`)}

function renderAchievements(){const grid=document.getElementById('achieve-grid');grid.innerHTML=ACHIEVEMENTS.map(a=>{const unlocked=G.achievements.includes(a.id);return`<div class="achieve-item ${unlocked?'unlocked':'locked'}"><span class="achieve-icon">${a.emoji}</span><div class="achieve-name">${a.name}</div><div class="achieve-desc">${a.desc}</div></div>`}).join('')}

function checkAchievements(){const has=id=>G.achievements.includes(id);const unlock=(id,reward)=>{if(!has(id)){G.achievements.push(id);G.coins+=reward;updateCoins();showToast(`🏆 成就解锁: ${ACHIEVEMENTS.find(a=>a.id===id).name}! +${reward}🪙`)}};
const plantCount=G.plants.filter(p=>p).length;if(plantCount>=1)unlock('firstPlant',50);if(G.totalBlooms>=10)unlock('bloom10',200);if(G.streak>=7)unlock('weekStreak',500);if(G.unlockedTypes.length>=PLANT_TYPES.length)unlock('allTypes',300);if(G.coins>=1000)unlock('rich',100);saveState();renderAchievements()}

function updateCoins(){document.getElementById('coins').textContent=G.coins}

function switchTab(tab){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.nav-btn:nth-child(${tab==='garden'?1:tab==='shop'?2:3})`).classList.add('active');document.querySelectorAll('.sections').forEach(s=>s.classList.remove('active'));document.getElementById(tab+'-tab').classList.add('active');if(tab==='shop')renderShop();if(tab==='achieve')renderAchievements()}

function closeModal(){document.getElementById('plant-modal').classList.remove('active');location.reload()}

function initDailyReset(){const today=getToday();if(G.lastLogin&&G.lastLogin!==today){if(G.lastLogin===getYesterday()){G.streak++;showToast(`连续打卡 ${G.streak} 天!`)}else{G.streak=0;showToast('打卡中断，重新开始!')}G.tasks={water:false,sun:false,prune:false,fertilize:false};updateWeather()}G.lastLogin=today;saveState()}

function tick(){G.plants.forEach((plant,i)=>{if(plant){const elapsed=(Date.now()-plant.lastUpdate)/(1000*60*60);if(elapsed>0){const gain=elapsed*(G.weather===WEATHERS[3]?0:G.weather===WEATHERS[0]?1.2:1);G.plants[i].progress=Math.min(plant.maxProgress,plant.progress+gain);G.plants[i].lastUpdate=Date.now()}}});renderPlants()}

loadState();initDailyReset();updateWeather();renderPlants();renderTasks();renderAchievements();updateCoins();setInterval(tick,60000);
</script>
</body>
</html>
